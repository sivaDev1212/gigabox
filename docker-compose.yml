services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gigabox
      POSTGRES_PASSWORD: gigabox
      POSTGRES_DB: gigabox
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/01-init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gigabox -d gigabox"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://gigabox:gigabox@postgres:5432/gigabox?schema=public
      CORS_ORIGIN: http://localhost:5173,http://localhost:8080
      ORDER_RATE_LIMIT_WINDOW_MS: 60000
      ORDER_RATE_LIMIT_MAX: 20
      REDIS_URL: redis://redis:6379
      AUTO_CANCEL_MINUTES: 5
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
